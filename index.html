    <meta name="theme-color" content="#0b0b0b" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Mark that scripts run, so motion may hide elements before they
      // arrive, and apply the saved theme before the first paint so the page
      // never flashes the wrong one. Dark is the default.
      document.documentElement.classList.add("js");
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content =
            "#eeedea";
          document.querySelector('meta[name="color-scheme"]').content = "light";
        }
      } catch {
        // Storage can be blocked; the default theme stays.
      }
    </script>
